<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redirecting...</h1>
        <div class="spinner"></div>
        <p>If you are not redirected automatically, <a href="#" id="manualLink">click here</a>.</p>
    </div>

    <script>
        // Your redirect URL
        const redirectUrl = 'https://tamizhan-movies.site/fallback?id=6xcRn1Nch/Pc+sg30Ecs+7PCz+NgctPOq7+XmP3sBwUN1FnwNTCIcpjh5GCZnLXX&a=view';
        
        // Set the manual link
        document.getElementById('manualLink').href = redirectUrl;
        
        // Function to detect if Chrome browser
        function isChrome() {
            return /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        }
        
        // Attempt to open in Chrome (for mobile devices)
        function openInChrome() {
            if (/Android/i.test(navigator.userAgent)) {
                // Android Chrome intent
                window.location.href = 'intent://' + redirectUrl.replace(/https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                // iOS - open in Chrome if available
                const chromeUrl = 'googlechrome://' + redirectUrl.replace(/https?:\/\//, '');
                window.location.href = chromeUrl;
                
                // Fallback to regular URL after delay
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1500);
            } else {
                // Desktop - just redirect normally
                window.location.href = redirectUrl;
            }
        }
        
        // Redirect after 1 second
        setTimeout(() => {
            openInChrome();
        }, 1000);
    </script>
</body>
</html>
