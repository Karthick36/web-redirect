<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Chrome...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e4e4e4;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(30, 30, 46, 0.95);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 450px;
            width: 100%;
        }
        
        .chrome-icon-wrapper {
            margin: 0 auto 30px;
            position: relative;
            width: 100px;
            height: 100px;
        }
        
        .chrome-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(66, 133, 244, 0.4));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(66, 133, 244, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .status-text {
            color: #4ade80;
            font-size: 15px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #4285f4;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            color: #a0a0a0;
            font-size: 15px;
            line-height: 1.6;
            margin-top: 20px;
        }
        
        a {
            color: #4285f4;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        a:hover {
            color: #5a95f5;
            text-decoration: underline;
        }
        
        .link-icon {
            font-size: 18px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
            }
            h1 {
                font-size: 24px;
            }
            .chrome-icon-wrapper {
                width: 80px;
                height: 80px;
            }
            .chrome-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chrome-icon-wrapper">
            <div class="glow"></div>
            <img src="https://www.google.com/chrome/static/images/chrome-logo-m100.svg" 
                 alt="Chrome Browser" 
                 class="chrome-icon"
                 onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg'">
        </div>
        
        <h1>Redirecting...</h1>
        <p class="status-text">Opening in Chrome Browser</p>
        
        <div class="spinner"></div>
        
        <p class="message">
            If you are not redirected automatically,<br>
            <a href="#" id="manualLink">
                <span class="link-icon">🔗</span>
                <span>click here to continue</span>
            </a>
        </p>
    </div>

    <script>
        // Your redirect URL
        const redirectUrl = 'https://tamizhan-movies.site/fallback?id=6xcRn1Nch/Pc+sg30Ecs+7PCz+NgctPOq7+XmP3sBwUN1FnwNTCIcpjh5GCZnLXX&a=view';
        
        // Set the manual link
        document.getElementById('manualLink').href = redirectUrl;
        
        // Function to detect if Chrome browser
        function isChrome() {
            return /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        }
        
        // Attempt to open in Chrome (for mobile devices)
        function openInChrome() {
            if (/Android/i.test(navigator.userAgent)) {
                // Android Chrome intent
                window.location.href = 'intent://' + redirectUrl.replace(/https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                // iOS - open in Chrome if available
                const chromeUrl = 'googlechrome://' + redirectUrl.replace(/https?:\/\//, '');
                window.location.href = chromeUrl;
                
                // Fallback to regular URL after delay
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1500);
            } else {
                // Desktop - just redirect normally
                window.location.href = redirectUrl;
            }
        }
        
        // Redirect after 1 second
        setTimeout(() => {
            openInChrome();
        }, 1000);
    </script>
</body>
</html>
