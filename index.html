<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in Chrome Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 20px;
            color: #e4e4e4;
        }
        
        .container {
            background: rgba(30, 30, 46, 0.95);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .chrome-icon-wrapper {
            margin: 0 auto 30px;
            position: relative;
            width: 100px;
            height: 100px;
        }
        
        .chrome-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(66, 133, 244, 0.4));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(66, 133, 244, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        h1 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #a0a0a0;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .browser-check {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .browser-check.chrome {
            background: rgba(52, 168, 83, 0.15);
            border-color: rgba(52, 168, 83, 0.3);
            color: #4ade80;
        }
        
        .browser-check.not-chrome {
            background: rgba(251, 188, 5, 0.15);
            border-color: rgba(251, 188, 5, 0.3);
            color: #fbbf24;
        }
        
        .status-icon {
            font-size: 20px;
        }
        
        .message {
            color: #b0b0b0;
            margin-bottom: 35px;
            line-height: 1.7;
            font-size: 16px;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 45px;
            margin: 8px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            box-shadow: 0 8px 25px rgba(66, 133, 244, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(66, 133, 244, 0.6);
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .instructions h3 {
            color: #ffffff;
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions ol {
            padding-left: 20px;
            color: #b0b0b0;
            line-height: 2;
        }
        
        .instructions li {
            margin-bottom: 12px;
            padding-left: 8px;
        }
        
        .instructions li::marker {
            color: #4285f4;
            font-weight: 700;
        }
        
        .countdown {
            font-size: 14px;
            color: #808080;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .countdown-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(66, 133, 244, 0.2);
            border-radius: 6px;
            color: #4285f4;
            font-weight: 700;
            font-size: 16px;
        }
        
        .hidden {
            display: none;
        }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4285f4;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
            }
            h1 {
                font-size: 26px;
            }
            .chrome-icon-wrapper {
                width: 80px;
                height: 80px;
            }
            .chrome-icon {
                width: 80px;
                height: 80px;
            }
            .btn {
                width: 100%;
                margin: 6px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chrome-icon-wrapper">
            <div class="glow"></div>
            <img src="https://www.google.com/chrome/static/images/chrome-logo-m100.svg" 
                 alt="Chrome Browser" 
                 class="chrome-icon"
                 onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg'">
        </div>
        
        <h1>Open in Chrome</h1>
        <p class="subtitle">For the best viewing experience</p>
        
        <div class="browser-check" id="browserStatus">
            <span class="spinner"></span>
            <span>Detecting browser...</span>
        </div>
        
        <div class="message">
            This content is optimized for Google Chrome browser to ensure the best performance and compatibility.
        </div>

        <!-- Chrome Users -->
        <div id="chromeUser" class="hidden">
            <button class="btn btn-primary" id="continueBtn">
                ✓ Continue to Content
            </button>
            
            <div class="countdown" id="autoRedirect"></div>
        </div>

        <!-- Non-Chrome Users -->
        <div id="nonChromeUser" class="hidden">
            <button class="btn btn-primary" id="openChromeBtn">
                🚀 Open in Chrome Browser
            </button>
            <button class="btn btn-secondary" id="continueAnywayBtn">
                Continue with Current Browser
            </button>
            
            <div class="instructions">
                <h3>
                    <span>📱</span>
                    <span>How to Open in Chrome</span>
                </h3>
                <ol id="instructionsList">
                    <!-- Instructions will be added dynamically -->
                </ol>
            </div>
        </div>
    </div>

    <script>
        // Your redirect URL
        const redirectUrl = 'https://tamizhan-movies.site/fallback?id=6xcRn1Nch/Pc+sg30Ecs+7PCz+NgctPOq7+XmP3sBwUN1FnwNTCIcpjh5GCZnLXX&a=view';
        
        // Detect browser
        function detectBrowser() {
            const userAgent = navigator.userAgent;
            const isChrome = /Chrome/.test(userAgent) && /Google Inc/.test(navigator.vendor);
            const isAndroid = /Android/i.test(userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(userAgent);
            
            return { isChrome, isAndroid, isIOS };
        }

        // Open in Chrome function
        function openInChrome() {
            const { isAndroid, isIOS } = detectBrowser();
            
            if (isAndroid) {
                // Android Chrome intent
                window.location.href = 'intent://' + redirectUrl.replace(/https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
                
                // Fallback after 2 seconds
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 2000);
            } else if (isIOS) {
                // iOS Chrome URL scheme
                const chromeUrl = 'googlechrome://' + redirectUrl.replace(/https?:\/\//, '');
                window.location.href = chromeUrl;
                
                // Fallback after 2 seconds
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 2000);
            } else {
                // Desktop - regular redirect
                window.location.href = redirectUrl;
            }
        }

        // Regular redirect
        function regularRedirect() {
            window.location.href = redirectUrl;
        }

        // Setup instructions based on platform
        function setupInstructions() {
            const { isAndroid, isIOS } = detectBrowser();
            const instructionsList = document.getElementById('instructionsList');
            
            if (isAndroid) {
                instructionsList.innerHTML = `
                    <li>Tap the "Open in Chrome Browser" button above</li>
                    <li>Select "Chrome" if prompted to choose an app</li>
                    <li>If Chrome isn't installed, download it from Play Store</li>
                    <li>Alternatively, copy the link and paste it in Chrome</li>
                `;
            } else if (isIOS) {
                instructionsList.innerHTML = `
                    <li>Tap the "Open in Chrome Browser" button above</li>
                    <li>Or tap the Share button (square with arrow up)</li>
                    <li>Scroll down and select "Open in Chrome"</li>
                    <li>If Chrome isn't listed, download it from the App Store first</li>
                `;
            } else {
                instructionsList.innerHTML = `
                    <li>Click the "Open in Chrome Browser" button above</li>
                    <li>Or copy this page's URL from the address bar</li>
                    <li>Open Google Chrome on your computer</li>
                    <li>Paste the URL into Chrome's address bar and press Enter</li>
                `;
            }
        }

        // Initialize page
        function init() {
            const { isChrome } = detectBrowser();
            const browserStatus = document.getElementById('browserStatus');
            const chromeUser = document.getElementById('chromeUser');
            const nonChromeUser = document.getElementById('nonChromeUser');
            
            setTimeout(() => {
                if (isChrome) {
                    browserStatus.className = 'browser-check chrome';
                    browserStatus.innerHTML = '<span class="status-icon">✓</span><span>You are using Chrome browser</span>';
                    chromeUser.classList.remove('hidden');
                    
                    // Auto redirect countdown
                    let countdown = 5;
                    const autoRedirectEl = document.getElementById('autoRedirect');
                    
                    const updateCountdown = () => {
                        autoRedirectEl.innerHTML = `
                            <span>Auto-redirecting in</span>
                            <span class="countdown-number">${countdown}</span>
                            <span>seconds...</span>
                        `;
                    };
                    
                    updateCountdown();
                    
                    const countdownInterval = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            updateCountdown();
                        } else {
                            clearInterval(countdownInterval);
                            regularRedirect();
                        }
                    }, 1000);
                    
                    // Manual continue button
                    document.getElementById('continueBtn').addEventListener('click', () => {
                        clearInterval(countdownInterval);
                        regularRedirect();
                    });
                    
                } else {
                    browserStatus.className = 'browser-check not-chrome';
                    browserStatus.innerHTML = '<span class="status-icon">⚠</span><span>You are not using Chrome browser</span>';
                    nonChromeUser.classList.remove('hidden');
                    setupInstructions();
                    
                    // Open in Chrome button
                    document.getElementById('openChromeBtn').addEventListener('click', openInChrome);
                    
                    // Continue anyway button
                    document.getElementById('continueAnywayBtn').addEventListener('click', regularRedirect);
                }
            }, 800);
        }

        // Run on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>
